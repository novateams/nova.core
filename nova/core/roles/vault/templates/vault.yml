---
services:
  vault:
    image: hashicorp/vault:{{ vault_version }}
    hostname: "{{ vault_container_name }}"
    container_name: "{{ vault_container_name }}"
    restart: unless-stopped
    volumes:
      - vault_config:/vault/config
      - vault_file:/vault/file
      - vault_logs:/vault/logs
    environment:
      - VAULT_ADDR=http://0.0.0.0:80
      - VAULT_API_ADDR=http://0.0.0.0:80
      - VAULT_ADDRESS=http://0.0.0.0:80
    command: server
    logging:
      driver: json-file
      options:
        max-size: 250m
        max-file: "1"

volumes:
  vault_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ vault_config_folder }}/config"

  vault_file:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ vault_config_folder }}/file"

  vault_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ vault_config_folder }}/logs"

networks:
  default:
    name: "{{ docker_network }}"
    external: true
