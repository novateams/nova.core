---
- name: Configuring forwarding...
  when: firewall_allow_routing
  block:
    - name: Enabling IPv4 forwarding...
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: 1
        sysctl_file: /etc/sysctl.d/99-ip-forwarding.conf
        state: "{{ 'present' if firewall_allow_ipv4_routing else 'absent' }}"
        reload: true
      when: firewall_allow_ipv4_routing

    - name: Enabling IPv6 forwarding...
      ansible.posix.sysctl:
        name: net.ipv6.conf.all.forwarding
        value: 1
        sysctl_file: /etc/sysctl.d/99-ip-forwarding.conf
        state: "{{ 'present' if firewall_allow_ipv6_routing else 'absent' }}"
        reload: true
      when: firewall_allow_ipv6_routing

- name: Disabling forwarding...
  ansible.builtin.file:
    path: /etc/sysctl.d/99-ip-forwarding.conf
    state: absent
  when: not firewall_allow_routing

- name: Removing legacy fw.conf file...
  ansible.builtin.file:
    path: /etc/sysctl.d/fw.conf
    state: absent

- name: Copying sysctl config...
  ansible.builtin.copy:
    src: "{{ firewall_config_file }}"
    dest: /etc/sysctl.d/98-firewall.conf
    mode: "0644"
  register: copy_sysctl_config

- name: Reloading sysctl config... # noqa: no-handler
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: copy_sysctl_config.changed

- name: Notifying about deprecation of allow_routing variable...
  when: allow_routing is defined
  block:
    - name: THE VARIABLE allow_routing IS DEPRECATED!
      ansible.builtin.debug:
        msg: |
          The 'allow_routing' variable is deprecated. Please use 'firewall_allow_routing' instead.

    - name: SLEEPING TO READ THE DEPRECATION WARNING...
      ansible.builtin.wait_for:
        timeout: 30
      become: false
      delegate_to: localhost

- name: Including iptables config...
  ansible.builtin.include_tasks: iptables.yml
  when: mode == "iptables"

- name: Including nftables config...
  ansible.builtin.include_tasks: nftables.yml
  when: mode == "nftables"

- name: Flushing handlers...
  ansible.builtin.meta: flush_handlers
