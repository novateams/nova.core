---
# Always checking if config file and service exists before making changes to avoid errors on systems that don't have them installed

- name: Checking if systemd exists...
  ansible.builtin.stat:
    path: /run/systemd/system
  register: systemd_exists

- name: Configuring NTP on systems with systemd...
  when: systemd_exists.stat.exists
  block:
    #############
    # Timesyncd #
    #############

    - name: Checking if systemd-timesyncd service exists...
      ansible.builtin.systemd_service:
        name: systemd-timesyncd
      register: systemd_timesyncd_service_exists

    - name: Setting following NTP servers in timesyncd.conf...
      ansible.builtin.lineinfile:
        dest: /etc/systemd/timesyncd.conf
        line: "{{ item.line }}"
        regexp: "{{ item.regexp }}"
        state: present
        create: true
        mode: "0644"
      loop_control:
        label: "{{ item.line }}"
      loop:
        - line: NTP={{ ntp_servers | join(' ') }}
          regexp: "^[#]?NTP="
      when: systemd_timesyncd_service_exists.status.LoadState in ["enabled", "loaded"]
      notify: restart_systemd_timesyncd

    ##########
    # Chrony #
    ##########

    - name: Checking if chronyd service exists...
      ansible.builtin.systemd_service:
        name: chronyd
      register: chronyd_service_exists

    - name: Configuring NTP in chrony/sources.d/ntp.conf...
      when: chronyd_service_exists.status.LoadState in ["enabled", "loaded"]
      notify: restart_chronyd
      block:
        - name: Creating /etc/chrony/sources.d directory...
          ansible.builtin.file:
            path: /etc/chrony/sources.d
            state: directory
            mode: "0755"

        - name: Creating /etc/chrony/sources.d/ntp.sources...
          ansible.builtin.copy:
            content: |
              {% for ntp_server in ntp_servers %}
              server {{ ntp_server }} iburst
              {% endfor %}
            dest: /etc/chrony/sources.d/ntp.sources
            mode: "0644"

        - name: Finding non-NTP sources files in /etc/chrony/sources.d...
          ansible.builtin.find:
            paths: /etc/chrony/sources.d
            patterns: "*.sources"
            excludes: ["ntp.sources"]
          register: chrony_non_ntp_sources

        - name: Removing non-NTP configuration files from /etc/chrony/sources.d...
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ chrony_non_ntp_sources.files }}"
          loop_control:
            label: "{{ item.path }}"

- name: Configuring NTP in /etc/conf.d/ntpd for Alpine...
  ansible.builtin.copy:
    content: |
      NTPD_OPTS="-s {{ ntp_servers | join(' -s ') }}"
    dest: /etc/conf.d/ntpd
    mode: "0644"
  when: ansible_facts.os_family == 'Alpine'
