---
services:
  coredns:
    image: coredns/coredns:{{ coredns_version }}
    container_name: coredns
    restart: unless-stopped
    volumes:
      - "{{ coredns_config_folder }}/Corefile:/Corefile"
      - coredns_zones:/zones
      - coredns_extra_config:/etc/coredns/conf.d

      # Needs to be the same outside and inside the container so named-checkzone can find the zonefiles
      - coredns_zones_include:{{ coredns_config_folder }}/zones_include
    ports:
      - "53:53"
      - "53:53/udp"
    logging:
      driver: json-file
      options:
        max-size: 250m
        max-file: "1"

volumes:
  coredns_zones:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ coredns_config_folder }}/zones"

  coredns_zones_include:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ coredns_config_folder }}/zones_include"

  coredns_extra_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ coredns_config_folder }}/conf.d"

networks:
  default:
    name: "{{ coredns_docker_network }}"
    external: true
