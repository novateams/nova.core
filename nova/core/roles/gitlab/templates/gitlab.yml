---
services:
  gitlab:
    container_name: gitlab
    hostname: gitlab-container
    image: gitlab/gitlab-ee:{{ gitlab_version }}
    pull_policy: always
    restart: always
    ports:
      - "{{ gitlab_ssh_port }}:22"
    volumes:
      - gitlab_etc:/etc/gitlab
      - gitlab_data:/var/opt/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_registry:/var/opt/gitlab/gitlab-rails/shared/registry
      - gitlab_temp_configuration:/temp_configuration

      - "{{ gitlab_config_folder }}/sshd_config:/assets/sshd_config"
      - "/srv/certs:/srv/certs"
      - "/usr/local/share/ca-certificates:/usr/local/share/ca-certificates"
      # GitLab keeps custom certs in this folder https://docs.gitlab.com/omnibus/settings/ssl.html#troubleshooting
      - "/usr/local/share/ca-certificates:/etc/gitlab/trusted-certs"

    # Overriding the default healthcheck from the GitLab image to be more lenient and allow for longer startup times
    healthcheck:
      test: curl --fail --silent --output /dev/null http://localhost/projects
      interval: 10s
      retries: 90
      timeout: 30s

    shm_size: "1G"
    environment:
      GITLAB_OMNIBUS_CONFIG: "from_file('/omnibus_config.rb')"
    configs:
      - source: gitlab
        target: /omnibus_config.rb

    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535

    logging:
      driver: json-file
      options:
        max-size: 250m
        max-file: "1"

volumes:
  gitlab_etc:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ gitlab_config_folder }}/etc"

  gitlab_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ gitlab_config_folder }}/data"

  gitlab_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ gitlab_config_folder }}/logs"

  gitlab_registry:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ gitlab_config_folder }}/registry"

  gitlab_temp_configuration:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ gitlab_config_folder }}/temp_configuration"

configs:
  gitlab:
    file: ./gitlab.rb

networks:
  default:
    name: "{{ gitlab_docker_network }}"
    external: true
