---
- name: Installing Gitlab runner for shell executor on Windows
  when: ansible_facts.system | default('') == 'Win32NT'
  block:
    - name: Installing gitlab runner on Windows, powershell executor..
      ansible.builtin.include_tasks: powershell-install-windows.yml

    - name: Registering runners on Windows..
      ansible.builtin.include_tasks: powershell-register-windows.yml
      loop: "{{ gitlab_runner_shell_runners }}"
      loop_control:
        loop_var: runner

    - name: Setting Gitlab runner concurrent jobs to {{ gitlab_runner_windows_concurrent }}...
      community.windows.win_lineinfile:
        path: "{{ gitlab_runner_windows_config_folder }}/config.toml"
        regex: ^concurrent = 1
        line: concurrent = {{ gitlab_runner_windows_concurrent }}
